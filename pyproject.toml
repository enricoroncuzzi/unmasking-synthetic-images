[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "unmasking-synthetic-images"
version = "0.5.0"
description = "Mixture of Experts framework for forensic detection and attribution of AI-generated images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["deep-learning", "forensics", "synthetic-images", "mixture-of-experts", "stable-diffusion"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["training", "evaluation", "data", "models", "scripts", "experiments", "profiling.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
