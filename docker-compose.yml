services:
  gradio:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - hf-cache:/app/.cache/huggingface
    environment:
      - DEVICE=cpu
      - STRATEGY=logit
    command: python -m demo.app

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/app/.cache/huggingface
    environment:
      - DEVICE=cpu
      - STRATEGY=logit
    command: uvicorn demo.api:app --host 0.0.0.0 --port 8000

volumes:
  hf-cache:
